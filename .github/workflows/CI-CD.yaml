name: TalkTime CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Docker Hub Login
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------
      # Build & Push Backend
      # -----------------------------
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/talktime-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/talktime-backend:${{ github.sha }}

      # -----------------------------
      # Build & Push Frontend
      # -----------------------------
      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/talktime-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/talktime-frontend:${{ github.sha }}

      # -----------------------------
      # Update Helm Image Tags
      # -----------------------------
      - name: Update Helm image tags
        run: |
          sed -i '/repository: priyanshu066\/talktime-backend/{n;s/tag:.*/tag: '${GITHUB_SHA}'/;}' helm/talktime/values.yaml

          sed -i '/repository: priyanshu066\/talktime-frontend/{n;s/tag:.*/tag: '${GITHUB_SHA}'/;}' helm/talktime/values.yaml

      # -----------------------------
      # Show Helm Changes
      # -----------------------------
      - name: Show updated Helm values
        run: |
          git diff -- helm/talktime/values.yaml

      # -----------------------------
      # Commit GitOps Change
      # -----------------------------
      - name: Commit and push Helm update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/talktime/values.yaml

          git commit -m "chore: update images to ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"

          git push