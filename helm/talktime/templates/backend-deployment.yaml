apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "talktime.fullname" . }}-backend
  labels:
    app: {{ include "talktime.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "talktime.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "talktime.name" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "talktime.fullname" . }}-backend-config
          env:
            - name: REDIS_URL
              value: "redis://{{ include "talktime.fullname" . }}-redis:6379"