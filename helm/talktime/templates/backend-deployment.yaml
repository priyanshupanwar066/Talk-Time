apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "talktime.fullname" . }}-backend
  labels:
    app: {{ include "talktime.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "talktime.name" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "talktime.name" . }}-backend
    spec:
      serviceAccountName: talktime-backend
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: {{ include "talktime.fullname" . }}-backend-config
            - secretRef:
                name: talktime-backend-secret
          env:
            - name: REDIS_URL
              value: "redis://{{ include "talktime.fullname" . }}-redis:6379"