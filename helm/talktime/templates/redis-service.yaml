apiVersion: v1
kind: Service
metadata:
  name: {{ include "talktime.fullname" . }}-redis
  labels:
    app: {{ include "talktime.name" . }}-redis
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: {{ include "talktime.name" . }}-redis